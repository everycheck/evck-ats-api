openapi: 3.0.0
info:
  title: EveryCheck ATS
  description: >
      This API allows integration with Applicant Tracking Systems (ATS) to manage job applications, retrieve assessment records, and download related documents.
      
      #### Authentication
      
      This API requires authentication using an API key. Add your API key to every request in the HTTP header `X-Auth-Token`.

      Every request must also include the `ats-version` header (current value: `1`).
  version: 1.0.0
  contact:
    email: contact@everycheck.fr
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    AtsVersion:
      name: ats-version
      in: header
      required: true
      description: API version of the ATS integration
      schema:
        type: string
        default: "1"
        example: "1"
  schemas:
    Package:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: 6a60093f-87f5-48b6-b82b-3fe308e26f4e
        name:
          type: string
        docs:
          type: array
          items:
            type: object
            properties:
              type: 
                type: string
                enum:
                  - identity
                  - job
                  - diploma
                  - other
                  - survey
              amount:
                type: integer
              desc:
                type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Invalid credentials."
security:
  - ApiKeyAuth: []
servers:
  - url: https://ats.everycheck.com
    description: Production server
  - url: https://ats-public.everycheck.com
    description: Sandbox server
  - url: https://monespace.everycheck.info/api/ats
    description: DEV server (internal)
  - url: https://monespace-qa.everycheck.info/api/ats
    description: QA server (internal)
  - url: https://monespace.everycheck.local/api/ats
    description: Development server
paths:
  /webhook:
    post:
      summary: Create an assessment
      parameters:
        - $ref: '#/components/parameters/AtsVersion'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                # --- Required ---
                package:
                  type: string
                  format: uuid
                  description: UUID of the package to use (from `/config`)
                resume:
                  description: Candidate's resume — a PDF file (8MB max) or an HTTPS URL to the document
                  oneOf:
                    - type: string
                      format: binary
                    - type: string
                      format: uri
                email:
                  type: string
                  format: email
                  description: Candidate's email address
                recruiter_email:
                  type: string
                  format: email
                  description: Recruiter's email address
                  example: "recruiter@example.com"
                update_url:
                  type: string
                  format: uri
                  description: Callback URL (HTTPS) called by our system to push assessment result updates
                  example: "https://ats.example.com/everycheck/callback"
                # --- Optional — Candidate ---
                firstname:
                  type: string
                  maxLength: 255
                  description: Candidate's first name
                  example: "John"
                lastname:
                  type: string
                  maxLength: 255
                  description: Candidate's last name
                  example: "Doe"
                phone:
                  type: string
                  maxLength: 20
                  description: Candidate's phone number
                  example: "+33123456789"
                identity:
                  description: Candidate's identity document — a file (8MB max) or an HTTPS URL
                  oneOf:
                    - type: string
                      format: binary
                    - type: string
                      format: uri
                authorization:
                  description: Candidate's signed authorization — a file (8MB max) or an HTTPS URL
                  oneOf:
                    - type: string
                      format: binary
                    - type: string
                      format: uri
                # --- Optional — Recruiter ---
                recruiter_firstname:
                  type: string
                  maxLength: 255
                  description: Recruiter's first name
                  example: "Alice"
                recruiter_lastname:
                  type: string
                  maxLength: 255
                  description: Recruiter's last name
                  example: "Smith"
                recruiter_team:
                  type: string
                  maxLength: 255
                  description: Recruiter's team
                  example: "Global"
                # --- Optional — Additional information ---
                label:
                  type: string
                  description: Identifier for the assessment
                  example: "ID123"
                survey:
                  type: string
                  format: uuid
                  description: Questionnaire UUID (from `/config`, required if the package includes a reference check)
                diplomas:
                  type: string
                  maxLength: 255
                  description: Information about diplomas to check
                  example: "Bachelor of Science in Computer Science"
                jobs:
                  type: string
                  maxLength: 255
                  description: Information about jobs to check
                  example: "Senior Developer"
                comment:
                  type: string
                  maxLength: 512
                  description: Free comment to help our team
                  example: "This is a comment to help the team."
                # --- Optional — Experiences (experiences[], max 6 entries) ---
                "experiences[0][type]":
                  type: string
                  enum:
                    - job
                    - diploma
                  description: Type of the first experience
                  example: "job"
                "experiences[0][name]":
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Title for the first experience
                  example: "Senior Developer"
                "experiences[0][place]":
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Location / institution for the first experience
                  example: "TechCorp"
                "experiences[0][start]":
                  type: string
                  description: Start date (YYYY-MM format) for the first experience
                  example: "2020-01"
                "experiences[0][end]":
                  type: string
                  description: End date (YYYY-MM format, ≥ start) for the first experience
                  example: "2022-12"
                "experiences[0][file]":
                  description: Experience file for the first experience — a file (8MB max) or an HTTPS URL
                  oneOf:
                    - type: string
                      format: binary
                    - type: string
                      format: uri
                "experiences[1][type]":
                  type: string
                  enum:
                    - job
                    - diploma
                  description: Type of the second experience
                  example: "diploma"
                "experiences[1][name]":
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Title for the second experience
                  example: "Bachelor of Science in Computer Science"
                "experiences[1][place]":
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Location / institution for the second experience
                  example: "StartupXYZ"
                "experiences[1][start]":
                  type: string
                  description: Start date (YYYY-MM format) for the second experience
                  example: "2018-06"
                "experiences[1][end]":
                  type: string
                  description: End date (YYYY-MM format, ≥ start) for the second experience
                  example: "2019-12"
                "experiences[1][file]":
                  description: Experience file for the second experience — a file (8MB max) or an HTTPS URL
                  oneOf:
                    - type: string
                      format: binary
                    - type: string
                      format: uri
              required:
                - package
                - resume
                - email
                - recruiter_email
                - update_url
      responses:
        '201':
          description: A JSON of assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                    example: 6a60093f-87f5-48b6-b82b-3fe308e26f4e
                  date:
                    type: string
                    format: date-time
                    description: Last modification date
                  status:
                    type: string
                    enum:
                      - Created
                      - ClientSealed
                      - ApplicantSealed
                      - CheckFinished
                      - CheckCanceled
                    description: |
                      Enum to represent the status of a job application.
                      Possible values:
                      - `Created`: The application has been received but not yet started.
                      - `ClientSealed`: The application is started, waiting for applicant filling.
                      - `ApplicantSealed`: The candidate has filled the forms.
                      - `CheckFinished`: The application's checks have been completed.
                      - `CheckCanceled`: The application's checks have been canceled.
                  link:
                    type: string
                    format: uri
                    example: https://www.everycheck.com/study/6a60093f-87f5-48b6-b82b-3fe308e26f4e
                    description: URL to access the assessment on EveryCheck platform
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  children:
                    type: object
                    properties:
                      file:
                        type: array
                        items:
                          type: string
                        maxItems: 0
                      email:
                        type: array
                        items:
                          type: string
                        maxItems: 0
                      package:
                        type: object
                        properties:
                          errors:
                            type: array
                            items:
                              type: string
                              example: This value is not valid.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config:
    get:
      summary: List available packages and surveys
      description: Returns a list of packages and surveys that can be used to specify assessment rules.
      parameters:
        - $ref: '#/components/parameters/AtsVersion'
      responses:
        '200':
          description: A list of packages and surveys
          content:
           application/json:
              schema:
                  type: object
                  properties:
                    packages:
                      type: array
                      items:
                        $ref: '#/components/schemas/Package'
                    surveys:
                      type: array
                      items:
                        type: object
                        properties:
                          uuid:
                            type: string
                            format: uuid
                            example: 6a60093f-87f5-48b6-b82b-3fe308e26f4e
                          name:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
